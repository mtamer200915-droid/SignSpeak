name: Publish Signova website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base:
        description: Temporary Signova V2 API origin
        required: false
        type: string
      api_build:
        description: Commit used by the temporary Signova V2 API
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SIGNOVA_V2_API_BASE: ${{ inputs.api_base || vars.SIGNOVA_V2_API_BASE }}
      SIGNOVA_V2_API_BUILD: ${{ inputs.api_build || vars.SIGNOVA_V2_API_BUILD }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website files only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            app.js
            framing.css
            index.html
            style.css
            SignNova_Complete.py
            predict.py
            signova_features.py
            Signova_Frontend_DarkAI/app.py
            Signova_Frontend_DarkAI/pose_infer.py
            Version 2 - Site Nova/prepare_data.py
            Version 2 - Site Nova/train_model.py
            Version 2 - Site Nova/train_character_model.py
            Version 2 - Site Nova/learning/word-sign-videos/**
            Version 2 - Site Nova/web/**
            Version 2 - Site Nova/api/app.py
          sparse-checkout-cone-mode: false

      - name: Check application syntax
        run: |
          node --check app.js
          node --check "Version 2 - Site Nova/web/app.js"
          python3 -m py_compile SignNova_Complete.py predict.py signova_features.py Signova_Frontend_DarkAI/app.py Signova_Frontend_DarkAI/pose_infer.py "Version 2 - Site Nova/prepare_data.py" "Version 2 - Site Nova/train_model.py" "Version 2 - Site Nova/train_character_model.py"
          python3 -m py_compile "Version 2 - Site Nova/api/app.py"

      - name: Prepare static website
        run: |
          mkdir site
          cp index.html style.css framing.css app.js site/
          mkdir -p site/v2
          cp -R "Version 2 - Site Nova/web/." site/v2/
          mkdir -p site/v2/learning/word-sign-videos
          cp -R "Version 2 - Site Nova/learning/word-sign-videos/." site/v2/learning/word-sign-videos/
          website_version=$(python3 -c 'import json; print(json.load(open("Version 2 - Site Nova/web/version.json"))["version"])')
          printf '{"version":"%s","build":"%s"}\n' "$website_version" "$GITHUB_SHA" > site/v2/version.json
          python3 - "$SIGNOVA_V2_API_BASE" "$SIGNOVA_V2_API_BUILD" > site/v2/api-config.js <<'PY'
          import json
          import sys
          from urllib.parse import urlparse

          api_base, api_build = sys.argv[1:]
          if api_base:
              parsed = urlparse(api_base)
              if parsed.scheme != "https" or not parsed.netloc or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
                  raise SystemExit("SIGNOVA_V2_API_BASE must be an HTTPS API origin without a path or query.")
          print(f"window.SIGNOVA_API_BASE = {json.dumps(api_base)};")
          print(f"window.SIGNOVA_API_BUILD = {json.dumps(api_build)};")
          PY
          api_config_revision=$(printf '%s|%s' "$SIGNOVA_V2_API_BASE" "$SIGNOVA_V2_API_BUILD" | sha256sum | cut -c1-16)
          sed -i "s#src=\"api-config.js\"#src=\"api-config.js?connection=${api_config_revision}\"#" site/v2/index.html
          sed -i "s#src=\"app.js\"#src=\"app.js?build=${GITHUB_SHA}\"#" site/v2/index.html
          touch site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
