name: Start temporary Signova V2 team demo

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: How long the shared Signova V2 demo stays online
        type: choice
        required: true
        default: "60"
        options:
          - "15"
          - "30"
          - "60"
          - "180"
          - "315"

permissions:
  contents: read

concurrency:
  group: signova-v2-team-demo
  # A second manual dispatch must not silently take the public API offline.
  cancel-in-progress: false

jobs:
  team-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the V2 API and trained model
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            Version 2 - Site Nova/api/app.py
            Version 2 - Site Nova/api/requirements.txt
            Version 2 - Site Nova/api/models/signova_v2.keras
            Version 2 - Site Nova/api/models/class_names.json
            Version 2 - Site Nova/api/models/model_info.json
            Version 2 - Site Nova/api/models/signova_characters.keras
            Version 2 - Site Nova/api/models/character_class_names.json
            Version 2 - Site Nova/api/models/character_model_info.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Version 2 - Site Nova/api/requirements.txt

      - name: Install the CPU-only prediction API
        run: python -m pip install -r "Version 2 - Site Nova/api/requirements.txt"

      - name: Start API and wait for the model
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "1"
          TF_ENABLE_ONEDNN_OPTS: "0"
          TF_NUM_INTEROP_THREADS: "1"
          TF_NUM_INTRAOP_THREADS: "1"
          SIGNOVA_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat >/tmp/signova-v2-supervisor.sh <<'SH'
          #!/usr/bin/env bash
          set +e
          while [ ! -f /tmp/signova-v2-stop ]; do
            python -m uvicorn app:app --app-dir "Version 2 - Site Nova/api" --host 0.0.0.0 --port 8000 --workers 1 >>/tmp/signova-v2-api.log 2>&1
            status=$?
            if [ -f /tmp/signova-v2-stop ]; then break; fi
            echo "Signova V2 API exited with status $status; restarting in 3 seconds." >>/tmp/signova-v2-api.log
            sleep 3
          done
          SH
          chmod +x /tmp/signova-v2-supervisor.sh
          nohup bash /tmp/signova-v2-supervisor.sh >/tmp/signova-v2-supervisor.log 2>&1 </dev/null &
          echo $! >/tmp/signova-v2-api.pid
          ready=0
          for attempt in $(seq 1 72); do
            if curl --silent --fail http://127.0.0.1:8000/health --output /tmp/signova-v2-health.json; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/signova-v2-api.log
            exit 1
          fi
          cat /tmp/signova-v2-health.json

      - name: Require both trained prediction models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path("/tmp/signova-v2-health.json").read_text())
          modes = health.get("available_modes", {})
          words = modes.get("words", {})
          characters = modes.get("characters", {})
          expected_characters = set("ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789") | {"DELETE", "NOTHING", "SPACE", "UNKNOWN"}
          assert health.get("model_version") == "v2", "Unexpected word model version."
          assert words.get("model_loaded") is True and len(words.get("classes", [])) == 20, "The 20-class word model did not load."
          assert characters.get("model_loaded") is True, "The letters-and-numbers model did not load."
          assert set(characters.get("classes", [])) == expected_characters, "The character model labels do not match the expected 40 classes."
          print("Both Signova V2 models loaded: 20 word classes and 40 character classes.")
          print(f"Word held-out Top-1 accuracy: {health.get('test_accuracy')}")
          print(f"Character held-out image accuracy: {characters.get('test_accuracy')}")
          PY

      - name: Check a video upload through the local API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([
              ffmpeg, "-hide_banner", "-loglevel", "error", "-f", "lavfi",
              "-i", "color=c=black:s=320x240:r=8:d=2", "-an", "-pix_fmt", "yuv420p",
              "-y", "/tmp/signova-v2-smoke.mp4"
          ], check=True)
          PY
          curl --silent --show-error --fail \
            --form "file=@/tmp/signova-v2-smoke.mp4;filename=smoke.mp4" \
            http://127.0.0.1:8000/api/predict --output /tmp/signova-v2-prediction.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path("/tmp/signova-v2-health.json").read_text())
          result = json.loads(Path("/tmp/signova-v2-prediction.json").read_text())
          assert result.get("word") in health.get("classes", [])
          assert 0 <= result.get("confidence", -1) <= 100
          assert isinstance(result.get("suggestions"), list) and result["suggestions"]
          print(f"Upload/prediction smoke check returned {result['word']!r}.")
          print("This checks API wiring only; it does not measure sign accuracy.")
          PY
          character_ready=$(python -c 'import json; from pathlib import Path; data=json.loads(Path("/tmp/signova-v2-health.json").read_text()); print(str(data.get("available_modes", {}).get("characters", {}).get("model_loaded", False)).lower())')
          if [ "$character_ready" = "true" ]; then
            imageio_ffmpeg_bin=$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )
            "$imageio_ffmpeg_bin" -hide_banner -loglevel error -f lavfi \
              -i color=c=gray:s=320x320 -frames:v 1 -y /tmp/signova-character-smoke.jpg
            curl --silent --show-error --fail \
              --form "file=@/tmp/signova-character-smoke.jpg;filename=smoke.jpg;type=image/jpeg" \
              --form "mode=characters" \
              http://127.0.0.1:8000/api/predict --output /tmp/signova-character-prediction.json
            python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path("/tmp/signova-v2-health.json").read_text())
          result = json.loads(Path("/tmp/signova-character-prediction.json").read_text())
          classes = health["available_modes"]["characters"]["classes"]
          assert result.get("word") in classes
          assert result.get("prediction_mode") == "characters"
          print(f"Character image smoke check returned {result['word']!r}.")
          PY
          else
            printf 'model-not-ready-smoke' >/tmp/signova-character-smoke.jpg
            character_status=$(curl --silent --show-error --output /tmp/signova-character-unavailable.json \
              --write-out '%{http_code}' \
              --form "file=@/tmp/signova-character-smoke.jpg;filename=smoke.jpg;type=image/jpeg" \
              --form "mode=characters" \
              http://127.0.0.1:8000/api/predict)
            if [ "$character_status" != "503" ]; then
              cat /tmp/signova-character-unavailable.json
              echo "Expected an explicit 503 while the character model is unavailable; got $character_status."
              exit 1
            fi
            python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/signova-character-unavailable.json").read_text())
          assert "not trained or installed" in result.get("detail", "")
          print("Character-photo route correctly reports the missing model without falling back to words.")
          PY
          fi

      - name: Start and verify the API, then get the connected website link
        shell: bash
        env:
          DEMO_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          cloudflared_path="$RUNNER_TEMP/cloudflared"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output "$cloudflared_path"
          chmod +x "$cloudflared_path"
          "$cloudflared_path" tunnel --no-autoupdate --url http://127.0.0.1:8000 \
            >/tmp/signova-v2-cloudflared.log 2>&1 &
          echo $! >/tmp/signova-v2-cloudflared.pid

          api_url=""
          for attempt in $(seq 1 60); do
            api_url=$(grep -oE 'https://[[:alnum:]-]+\.trycloudflare\.com' /tmp/signova-v2-cloudflared.log | head -n 1 || true)
            if [ -n "$api_url" ] && curl --silent --fail "$api_url/health" --output /tmp/signova-v2-public-health.json; then
              break
            fi
            sleep 2
          done
          if [ -z "$api_url" ] || [ ! -s /tmp/signova-v2-public-health.json ]; then
            cat /tmp/signova-v2-cloudflared.log
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          health = json.loads(Path("/tmp/signova-v2-public-health.json").read_text())
          assert health.get("status") == "ok" and health.get("model_version") == "v2"
          modes = health.get("available_modes", {})
          expected_characters = set("ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789") | {"DELETE", "NOTHING", "SPACE", "UNKNOWN"}
          assert health.get("build_sha") == os.environ["GITHUB_SHA"], "The public API is from a different or older build."
          assert modes.get("words", {}).get("model_loaded") is True and len(modes.get("words", {}).get("classes", [])) == 20
          assert modes.get("characters", {}).get("model_loaded") is True
          assert set(modes.get("characters", {}).get("classes", [])) == expected_characters
          print("Public V2 API health check succeeded for both models and the current build.")
          PY

          site_version=""
          for attempt in $(seq 1 60); do
            site_version=$(curl --silent --fail "https://mtamer200915-droid.github.io/SignSpeak/v2/version.json?check=${GITHUB_SHA}" || true)
            if [ -n "$site_version" ] && python -c 'import json,sys; data=json.loads(sys.argv[1]); sys.exit(0 if data.get("build")==sys.argv[2] else 1)' "$site_version" "$GITHUB_SHA"; then
              break
            fi
            sleep 5
          done
          if [ -z "$site_version" ] || ! python -c 'import json,sys; data=json.loads(sys.argv[1]); sys.exit(0 if data.get("build")==sys.argv[2] else 1)' "$site_version" "$GITHUB_SHA"; then
            echo "The website for this API build is not published yet. Wait for the Pages workflow to finish, then run the API demo again."
            exit 1
          fi
          website_version=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["version"])' "$site_version")

          expires_at=$(date -u -d "+${DEMO_MINUTES} minutes" +%s)
          echo "$expires_at" >/tmp/signova-v2-expires-at
          site_url="https://mtamer200915-droid.github.io/SignSpeak/v2/?api=${api_url}&build=${GITHUB_SHA}"
          {
            echo "## Signova V2 ${website_version} demo is ready"
            echo "- [Open Signova V2 ${website_version} connected to this live API](${site_url})"
            echo "- API health: [${api_url}/health](${api_url}/health)"
            echo "- Website and API build: ${GITHUB_SHA:0:7}"
            echo "- This shared API stays online for **${DEMO_MINUTES} minutes** after the public check."
            echo "- Word-video labels: book, deaf, eat, drink, family, go, happy, help, home, like, mother, need, no, not, please, school, water, want, yes, you."
            echo "- Photo-character labels: A–Z, 0–9, DELETE, NOTHING, SPACE, and UNKNOWN. Photos use the character model; videos use the word model through the same API."
            echo "- Character image holdout: 88.3% Top-1 and 97.1% Top-3 across 1,575 images; this is not independent camera accuracy."
            echo "- The upload smoke check verifies wiring only; the independent accuracy result is listed on the site."
            echo "- Start future demos from [the Signova V2 API workflow](https://github.com/mtamer200915-droid/SignSpeak/actions/workflows/team-demo-v2.yml), choose a duration, and use the connected link from the newest run summary."
            echo "- The temporary API URL is public. Use demo clips only."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Connected website: ${site_url}"
          echo "SIGNOVA_V2_DEMO_API_URL=${api_url}" >> "$GITHUB_ENV"
          echo "SIGNOVA_V2_DEMO_EXPIRES_AT=${expires_at}" >> "$GITHUB_ENV"

      - name: Keep the shared API available for the selected time
        shell: bash
        run: |
          expires_at="${SIGNOVA_V2_DEMO_EXPIRES_AT:-}"
          if [ -z "$expires_at" ]; then
            echo "The Signova V2 demo expiry time was not set."
            exit 1
          fi
          remaining=$((expires_at - $(date +%s)))
          if [ "$remaining" -le 0 ]; then
            echo "The selected demo duration expired before readiness completed."
            exit 1
          fi
          sleep "$remaining"

      - name: Stop the V2 API and tunnel
        if: always()
        shell: bash
        run: |
          touch /tmp/signova-v2-stop
          if [ -f /tmp/signova-v2-cloudflared.pid ]; then
            kill "$(cat /tmp/signova-v2-cloudflared.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/signova-v2-api.pid ]; then
            kill "$(cat /tmp/signova-v2-api.pid)" 2>/dev/null || true
          fi

      - name: Show logs if API startup or public access failed
        if: failure()
        run: |
          cat /tmp/signova-v2-api.log || true
          cat /tmp/signova-v2-cloudflared.log || true
